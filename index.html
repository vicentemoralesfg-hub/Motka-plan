let S={};try{S=JSON.parse(localStorage.getItem("motka30"))||{}}catch(e){}
["c","d","t","meta","sc","sr","g","sf","sp","x"].forEach(k=>S[k]=S[k]||{});

const ph=i=>i<7?0:i<14?1:i<21?2:3,ks=(i,j)=>i+"-"+j,dd=i=>S.d[i]||(S.d[i]={});

function ds(k,v){dd(cur)[k]=v;sv()}function tg(i,j){S.c[ks(i,j)]=!S.c[ks(i,j)];sv();draw()}function go(i){cur=i;draw()}

h+=`<h2>Día ${i+1} · ${d[0]}</h2><div class="gl"><b>Objetivo:</b> ${d[1]}<br><b>Resultado esperado:</b> ${d[2]}<br><b>Tiempo estimado:</b> ${p[1]} · <b>Métrica:</b> ${d[5]||p[2]}<br><b>Aprender:</b> ${d[6]||p[3]}<br><b>Documento a crear:</b> ${d[7]||p[4]}</div><div class="cd"><b>Si ocurre X → hacer Y:</b> ${d[8]||p[5]}</div>`;

const tot=mh.reduce((a,b)=>a+N(b),0);
h+=`<h3>Meta Ads hoy (${d[4]})</h3><div class="gr">`+["Teoría","Implementación","Análisis","Optimización"].map((n,k)=>`<label>${n} (h)<input class="ip" type="number" step="0.5" min="0" value="${mh[k]||""}" onchange="mhs(${k},this.value)"></label>`).join("")+`</div>`+(N(mh[0])>2&&!N(mh[1])?`<div class="no">Más de 2 h de teoría sin implementar nada: detente y haz algo en Ads Manager.</div>`:`<div class="pc">Total ${tot} h. Aprender → implementar → medir → corregir.</div>`);
h+=`<h3>Seguimiento del día</h3><div class="gr"><label>Estado${sel(["Pendiente","En progreso","Terminado"],x.st||"Pendiente","ds('st',this.value);draw()")}</label><label>Semáforo${sel(["—","🟢 Correcto","🟡 Investigar","🔴 Corregir"],x.sm||"—","ds('sm',this.value);draw()")}</label></div><div class="gr" style="margin-top:8px">`+[["rr","Resultado real"],["ca","Calidad"],["pb","Problema"],["cn","Conclusión"],["pa","Próxima acción"]].map(q=>`<label>${q[1]}<input class="ip" value="${esc(x[q[0]])}" onchange="ds('${q[0]}',this.value)"></label>`).join("")+`</div><h3>Notas</h3><textarea onchange="ds('nt',this.value)" placeholder="Notas del día...">${esc(x.nt)}</textarea>`;
return h+`<div style="display:flex;gap:8px;margin-top:10px"><button class="bt" ${i?"":"disabled"} onclick="go(${i-1})">Anterior</button><button class="bt p" ${i<29?"":"disabled"} onclick="go(${i+1})">Siguiente</button></div>`}
function mhs(k,v){const x=dd(cur);x.mh=x.mh||[0,0,0,0];x.mh[k]=v;sv();draw()}
function cell(n,i,c,r){const t=c[2],v=r[c[0]];if(t=="k")return esc(c[3](r));if(t=="s")return sel(c[3],v||c[3][0],`ce('${n}',${i},'${c[0]}',this.value)`);return`<input type="${t=="n"?"number":t=="d"?"date":"text"}" value="${esc(v)}" onchange="ce('${n}',${i},'${c[0]}',this.value)">`}
function tbl(n,note){const T=TB[n],R=S.t[n]||[];let o=R.map((_,i)=>i);if(T.sort&&S.ms)o.sort((a,b)=>T.sort(R[b])-T.sort(R[a]));
let h=(note?`<div class="gl">${note}</div>`:"")+`<input class="ip" placeholder="Filtrar..." oninput="fl(this)"><div class="tw"><table><tr>`+T.c.map(c=>`<th>${c[1]}</th>`).join("")+`<th></th></tr>`;
o.forEach(i=>{const r=R[i];h+=`<tr class="${T.flag?T.flag(r):""}">`+T.c.map(c=>`<td>${cell(n,i,c,r)}</td>`).join("")+`<td><button class="lk" onclick="rd('${n}',${i})">✕</button></td></tr>`});
return h+`</table></div><button class="bt p" onclick="ra('${n}')">+ Agregar fila</button>`+(T.sort?`<button class="bt" onclick="S.ms=!S.ms;sv();draw()">${S.ms?"Orden original":"Ordenar por mejor oportunidad"}</button>`:"")}
function ce(n,i,k,v){S.t[n][i][k]=v;sv();draw()}function ra(n){(S.t[n]=S.t[n]||[]).push({f:today});sv();draw()}function rd(n,i){if(confirm("¿Borrar fila?")){S.t[n].splice(i,1);sv();draw()}}
function fl(el){const q=el.value.toLowerCase();[...el.nextElementSibling.querySelectorAll("tr")].slice(1).forEach(tr=>tr.style.display=[...tr.querySelectorAll("input,select")].map(e=>e.value).join(" ").toLowerCase().includes(q)?"":"none")}
const kp=(v,l,b)=>`<div class="kp ${b?"big":""}"><b>${v}</b><small>${l}</small></div>`,pct=(a,b)=>b?Math.round(a/b*100)+"%":"-";
function dash(){const O=S.t.own||[],B=S.t.buy||[],E=S.t.eco||[],M=S.meta,ix=(r)=>Math.max(0,E1.indexOf(r.es||"Lead")),r2=n=>O.filter(r=>r.es!="Perdido"&&ix(r)>=n).length,mt=O.filter(r=>r.fu=="Meta Ads"),m2=n=>mt.filter(r=>r.es!="Perdido"&&ix(r)>=n).length,bx=r=>Math.max(0,B1.indexOf(r.es||"Lead")),b2=n=>B.filter(r=>r.es!="Perdido"&&bx(r)>=n).length;
const g=N(M.gasto),cons=m2(7),ven=E.filter(r=>r.ve=="Sí"),bru=ven.reduce((a,r)=>a+N(r.pu)*N(r.cm)/100,0),gas=E.reduce((a,r)=>a+N(r.ga)+N(r.ad),0),dias=ven.length?Math.round(ven.reduce((a,r)=>a+N(r.di),0)/ven.length):0;
let h="<h2>Dashboard</h2><div class='gr'>"+kp(cons?fm(g/cons):"—","COSTO POR CONSIGNACIÓN ACEPTADA",1)+kp(N(M.leads)?fm(g/N(M.leads)):"—","CPL (referencia)")+kp(pct(cons,N(M.leads)),"Leads → consignación")+"</div><h3>Propietarios</h3><div class='gr'>"+["Leads","Contactados","Calificados","Documentos","Pre-score","Inspecciones","Aceptados","Contratos","Publicados","Vendidos"].map((l,k)=>kp(r2(k),l)).join("")+"</div><h3>Meta Ads (ingresa los datos del Ads Manager)</h3><div class='gr'>"+[["gasto","Gasto"],["impr","Impresiones"],["alc","Alcance"],["clics","Clics"],["leads","Leads"]].map(q=>`<label>${q[1]}<input class="ip" type="number" value="${M[q[0]]||""}" onchange="S.meta.${q[0]}=this.value;sv();draw()"></label>`).join("")+"</div><div class='gr' style='margin-top:8px'>"+kp(pct(N(M.clics),N(M.impr)),"CTR")+kp(mt.length,"Leads en CRM")+kp(m2(1),"Contactados")+kp(m2(2),"Calificados")+kp(m2(4),"Vehículos buenos")+kp(m2(5),"Inspecciones")+kp(cons,"Consignaciones")+"</div><h3>Compradores</h3><div class='gr'>"+["Leads","Contactados","Calificados","Financiamiento","Visitas","Ofertas","Reservas","Ventas"].map((l,k)=>kp(b2(k),l)).join("")+"</div><h3>Ventas</h3><div class='gr'>"+kp(ven.length,"Vendidos")+kp(fm(bru),"Comisión bruta")+kp(fm(gas),"Gastos")+kp(fm(bru-gas),"Comisión neta")+kp(dias+" d","Días promedio hasta venta")+kp(pct(ven.length,E.length),"Tasa de cierre")+"</div><h3>Motivos de rechazo</h3>";
const cn={};O.concat(B.map(r=>({mr:r.mr}))).forEach(r=>{if(r.mr)cn[r.mr]=(cn[r.mr]||0)+1});const mx=Math.max(1,...Object.values(cn));h+=Object.keys(cn).length?Object.entries(cn).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div>${esc(k)} · ${v}<div class="br"><i style="width:${v/mx*100}%"></i></div></div>`).join(""):"<div class='pc'>Sin rechazos registrados.</div>";
const sm={};Object.values(S.d).forEach(x=>{if(x.sm&&x.sm!="—")sm[x.sm[0]]=(sm[x.sm[0]]||0)+1});return h+`<h3>Semáforo de días</h3><div class='gr'>`+kp("🟢 "+(sm["🟢"]||0),"Correcto")+kp("🟡 "+(sm["🟡"]||0),"Investigar")+kp("🔴 "+(sm["🔴"]||0),"Corregir")+"</div>"}
function score(){const v=S.sc,t=SC.reduce((a,c,i)=>a+Math.min(c[1],N(v[i])),0),rj=AR.some((_,i)=>S.sr[i]),lv=rj?["RECHAZO AUTOMÁTICO","var(--rd)"]:t>=58?["Excelente","var(--ok)"]:t>=50?["Investigar","var(--yl)"]:t>=42?["Aceptar solo con razón fuerte","var(--yl)"]:["Normalmente rechazar","var(--rd)"];
return"<h2>Score del vehículo · 70 puntos</h2><div class='gr'>"+SC.map((c,i)=>`<label>${c[0]} (0-${c[1]})<input class="ip" type="number" min="0" max="${c[1]}" value="${v[i]||""}" onchange="S.sc[${i}]=this.value;sv();draw()"></label>`).join("")+`</div><div class="sg" style="background:${lv[1]}">${t} / 70 · ${lv[0]}</div><div class="pc">58-70 excelente · 50-57 investigar · 42-49 solo con razón fuerte · menos de 42 normalmente rechazar. Copia el puntaje al CRM.</div><h3>Rechazo automático</h3>`+AR.map((a,i)=>`<label class="t"><input type="checkbox" ${S.sr[i]?"checked":""} onchange="S.sr[${i}]=this.checked;sv();draw()"><span>${a}</span></label>`).join("")+`<button class="bt" onclick="S.sc={};S.sr={};sv();draw()">Limpiar</button>`}
function ctl(){let h="<div class='no'><b>NO HACER</b><ul>"+NH.map(x=>`<li>${x}</li>`).join("")+"</ul></div><h2>Gates de decisión</h2><div class='pc'>Son objetivos, no garantías.</div>";
GT.forEach((g,a)=>{h+=`<div class="cd"><b>${g[0]}</b>`+g[1].map((s,j)=>`<label class="t"><input type="checkbox" ${S.g[a+"-"+j]?"checked":""} onchange="S.g['${a}-${j}']=this.checked;sv();draw()"><span>${s}</span></label>`).join("")+"</div>"});
h+="<h2>Seguridad operativa</h2><div class='pc'>No es asesoría legal.</div>";SF.forEach((g,a)=>{h+=`<details><summary>${g[0]}</summary>`+g[1].map((s,j)=>`<label class="t"><input type="checkbox" ${S.sf[a+"-"+j]?"checked":""} onchange="S.sf['${a}-${j}']=this.checked;sv()"><span>${s}</span></label>`).join("")+"</details>"});
